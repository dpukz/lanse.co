<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lanse.ai – Contact</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="custom-cursor"></div>

  <header class="navbar">
    <div class="nav-left"><span class="logo">lanse.ai</span></div>
    <nav class="nav-center">
      <a href="index.html">Home</a>
      <a href="team.html">Team</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="nav-right">
      <a href="index.html#early-access" class="btn primary-btn">Get early access</a>
    </div>
  </header>

  <!-- SIMPLE HERO -->
  <section class="team-hero">
    <div class="container">
      <h1>Contact Us</h1>
      <p>Have questions or want to partner? We'd love to hear from you.</p>
    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="contact-section">
    <div class="container">
      <form class="contact-form" action="#" method="post">
        <input type="text"    placeholder="Your Name"    required>
        <input type="email"   placeholder="Your Email"   required>
        <textarea placeholder="Your Message" rows="6" required></textarea>
        <button type="submit" class="btn primary-btn">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <nav class="footer-nav">
        <a href="team.html">Team</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
      </nav>
      <p class="copyright">&copy; 2025 Lanse.ai — All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
